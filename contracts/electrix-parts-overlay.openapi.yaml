openapi: 3.0.1
info:
  title: ELECTRIX Parts API - ERP Integration Overlay
  version: 0.1.0-poc
  description: Geplante Ergänzungen zur vorhandenen WSCAD API. Nicht implementierte Operationen werden im ERP-Mockup simuliert.
servers:
  - url: http://localhost:10384
paths:
  /api/v1/parts/{partId}:
    get:
      summary: Vollständigen Artikel lesen
      parameters:
        - in: path
          name: partId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Artikel, content: { application/json: { schema: { $ref: '#/components/schemas/PartDetails' } } } }
    patch:
      summary: Ausgewählte Artikelsegmente ändern
      parameters:
        - in: path
          name: partId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PartWriteRequest' } } }
      responses:
        '200': { description: Änderungsergebnis, content: { application/json: { schema: { $ref: '#/components/schemas/PartWriteResult' } } } }
  /api/v1/parts/validate:
    post:
      summary: Artikel prüfen, ohne zu speichern
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PartWriteRequest' } } }
      responses:
        '200': { description: Validierungsergebnis }
  /api/v1/parts/upsert:
    post:
      summary: Artikel anhand des Business-Key anlegen oder aktualisieren
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PartUpsertRequest' } } }
      responses:
        '200': { description: Upsert-Ergebnis, content: { application/json: { schema: { $ref: '#/components/schemas/PartWriteResult' } } } }
  /api/v1/parts/batch/upsert:
    post:
      summary: Artikelstapel asynchron verarbeiten
      responses:
        '202': { description: Task gestartet }
  /api/v1/parts/changes:
    get:
      summary: Änderungen über einen Client-Cursor abrufen
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: pageSize
          schema: { type: integer, default: 500 }
      responses:
        '200': { description: Änderungsseite }
  /api/v1/parts/{partId}/approve:
    post:
      summary: Artikel freigeben
      parameters:
        - in: path
          name: partId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Lifecycle-Ergebnis }
  /api/v1/parts/{partId}/lifecycle:
    patch:
      summary: Verfügbarkeit, Sperre und Revision ändern
      parameters:
        - in: path
          name: partId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Lifecycle-Ergebnis }
  /api/v1/business-partners:
    get:
      summary: Hersteller und Lieferanten suchen
      responses:
        '200': { description: Trefferseite }
    post:
      summary: Geschäftspartner anlegen
      responses:
        '201': { description: Geschäftspartner angelegt }
  /api/v1/part-database/status:
    get:
      summary: Provider, Schema-Version und Schreibfähigkeit prüfen
      responses:
        '200': { description: Datenbankstatus }
components:
  schemas:
    PartWriteRequest:
      type: object
      required: [partNumber]
      properties:
        partNumber: { type: string }
        manufacturer: { type: object, additionalProperties: true }
        descriptions: { type: object, additionalProperties: true }
        commercial: { type: object, additionalProperties: true }
        technical: { type: object, additionalProperties: true }
        lifecycle: { type: object, additionalProperties: true }
        representations: { type: object, additionalProperties: true }
        attributes: { type: array, items: { type: object, additionalProperties: true } }
        source: { type: object, additionalProperties: true }
    PartUpsertRequest:
      type: object
      required: [match, part]
      properties:
        match: { type: object, additionalProperties: true }
        createIfMissing: { type: boolean, default: true }
        updateMode: { type: string, enum: [ProvidedFieldsOnly] }
        part: { $ref: '#/components/schemas/PartWriteRequest' }
    PartDetails:
      allOf:
        - $ref: '#/components/schemas/PartWriteRequest'
        - type: object
          properties:
            partId: { type: integer, format: int64 }
            version: { type: string }
    PartWriteResult:
      type: object
      properties:
        operation: { type: string, enum: [Created, Updated, Unchanged] }
        partId: { type: integer, format: int64 }
        partNumber: { type: string }
        version: { type: string }
